<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>⚙️ Admin Panel</h1>
        <button onclick="logout()" class="secondary">Logout</button>
    </header>

    <div class="admin-container">
        <div class="sidebar">
            <button onclick="showSection('dashboard')" class="active" id="btn-dashboard">📊 Analytics</button>
            <button onclick="showSection('add-game')" id="btn-add-game">➕ Add Game</button>
            <button onclick="showSection('manage')" id="btn-manage">📝 Manage Games</button>
            <button onclick="showSection('settings')" id="btn-settings">🎨 Theme & Tabs</button>
        </div>

        <main id="content">
            
            <section id="dashboard" class="panel-section active">
                <h2>Live Overview</h2>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-val" id="stat-users">0</div>
                        <div class="stat-label">Live Users (Simulated)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="stat-views">0</div>
                        <div class="stat-label">Total Views</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="stat-count">0</div>
                        <div class="stat-label">Games Installed</div>
                    </div>
                </div>

                <h3>🏆 Top Performers</h3>
                <div class="card" id="top-games-list" style="padding:20px;">
                    </div>
            </section>

            <section id="add-game" class="panel-section">
                <h2>Add New Game</h2>
                <div class="card" style="padding:20px;">
                    <input id="in-title" placeholder="Game Title">
                    <input id="in-logo" placeholder="Logo Image URL (e.g. https://imgur.com/...)">
                    <input id="in-embed" placeholder="Embed URL or Iframe Code">
                    <textarea id="in-desc" placeholder="Description" rows="3"></textarea>
                    
                    <div style="display:flex; gap:10px;">
                        <input id="in-tags" placeholder="Tags (action, 3d, racing)">
                        <select id="in-tab">
                            </select>
                    </div>

                    <button onclick="submitGame()" style="width:100%; margin-top:10px;">Publish Game</button>
                </div>
            </section>

            <section id="manage" class="panel-section">
                <h2>Manage Content</h2>
                <div id="game-list-admin" style="display:grid; gap:10px;"></div>
            </section>

            <section id="settings" class="panel-section">
                <h2>Site Customization</h2>
                
                <div class="card" style="padding:20px; margin-bottom:20px;">
                    <h3>Theme Colors</h3>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <label>Primary Color <input type="color" id="col-primary"></label>
                        <label>Background <input type="color" id="col-bg"></label>
                        <label>Card Color <input type="color" id="col-card"></label>
                        <label>Text Color <input type="color" id="col-text"></label>
                    </div>
                    <button onclick="saveThemeSettings()">Apply Theme</button>
                </div>

                <div class="card" style="padding:20px;">
                    <h3>Manage Tabs</h3>
                    <div style="display:flex; gap:10px;">
                        <input id="new-tab-name" placeholder="New Category Name">
                        <button onclick="addNewTab()" style="width:auto;">Add</button>
                    </div>
                    <ul id="tab-list-ul" style="padding-left:20px;"></ul>
                </div>
            </section>

        </main>
    </div>

    <script src="js/store.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
