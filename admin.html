<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="login">
  <h2>Admin Login</h2>
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Enter</button>
</div>

<div id="panel" hidden>

<h2>Admin Dashboard</h2>

<section class="card">
<h3>Add Game</h3>
<input id="title" placeholder="Title">
<textarea id="embed" placeholder="Embed or URL"></textarea>
<input id="tab" placeholder="Tab">
<button onclick="addGame()">Add</button>
</section>

<section class="card">
<h3>Tabs</h3>
<input id="newTab" placeholder="New tab">
<button onclick="addTab()">Add Tab</button>
<ul id="tabList"></ul>
</section>

<section class="card">
<h3>Theme</h3>
<input type="color" id="primary">
<input type="color" id="bg">
<input type="color" id="card">
<input type="color" id="text">
<button onclick="saveTheme()">Save Theme</button>
</section>

<section class="card">
<h3>Analytics</h3>
<div id="stats"></div>
</section>

</div>

<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
